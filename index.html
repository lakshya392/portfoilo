<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Poppins',sans-serif;
    background:#0f0a1f;
    color:white;
}

nav{
    display:flex;
    justify-content:space-between;
    padding:20px;
    background:rgba(255,255,255,0.05);
}

.logo{color:#a855f7;}

.nav-links a{
    margin:10px;
    color:white;
    text-decoration:none;
}

.hero{
    text-align:center;
    padding:80px 20px;
}

button{
    margin-top:20px;
    padding:12px 20px;
    border:none;
    border-radius:25px;
    background:#a855f7;
    color:white;
    cursor:pointer;
}

.glass{
    margin:30px auto;
    width:80%;
    padding:20px;
    background:rgba(255,255,255,0.05);
    border-radius:10px;
    text-align:center;
}

.profile {
    width: 150px;
    height: 150px;
    border-radius: 50%;   
    object-fit: cover;    
    border: 3px solid #a855f7;
    box-shadow: 0 0 20px rgba(168, 85, 247, 0.6);
}

.projects{
    display:flex;
    justify-content:center;
    gap:20px;
}

.card{
    padding:20px;
    background:rgba(255,255,255,0.08);
    border-radius:10px;
}

.card a{
    display:block;
    margin:5px;
    color:#a855f7;
}

input,textarea{
    width:80%;
    padding:10px;
    margin:10px;
    border-radius:10px;
    border:none;
}
</style>

</head>
<body>

<!-- NAVBAR -->
<nav>
    <h2 class="logo">MyPortfolio</h2>
    <div class="nav-links">
        <a href="#">Home</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
    </div>
</nav>

<!-- HERO -->
<section class="hero">
    <img src="1762962484533.jpg" class="profile" alt="profile">
    <h1>Hello, I'm Lakshya 👋</h1>
    <h2 id="typing"></h2>
    <button>Hire Me 🚀</button>
</section>

<!-- ABOUT -->
<div class="glass">
    <h2>About Me</h2>
    <p>I am a creative Video Editor and Designer who makes logos, banners and engaging videos.</p>
</div>

<!-- PROJECTS -->
<section id="projects" class="glass">
    <h2>My Projects</h2>
    <div class="projects">
        <div class="card">
            <h3>Video Edits 🎬</h3>
            <a href="#">Instagram Reels</a>
            <a href="#">YouTube Edits</a>
        </div>
        <div class="card">
            <h3>Designs 🎨</h3>
            <a href="#">Logos</a>
            <a href="#">Banners</a>
        </div>
    </div>
</section>

<!-- CONTACT -->
<section id="contact" class="glass">
    <h2>Contact Me</h2>
    <form id="contact-form">
        <input type="text" name="user_name" placeholder="Your Name" required><br>
        <input type="email" name="user_email" placeholder="Your Email" required><br>

        <select name="service" required>
            <option value="">Select Service</option>
            <option value="Video Editing">Video Editing</option>
            <option value="Logo Design">Logo Design</option>
            <option value="Banner Design">Banner Design</option>
        </select><br>

        <textarea name="message" placeholder="Your Message" required></textarea><br>
        <button type="submit">Send Message</button>
    </form>
</section>

<!-- EMAILJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@2/dist/email.min.js"></script>

<script>
// typing effect
const text = [
    "Video Editor 🎬",
    "Logo Designer 🎨",
    "Banner Designer 🚀"
];

let i = 0, j = 0, current = "", del = false;

function type() {
    let el = document.getElementById("typing");

    if (i < text.length) {
        if (!del && j <= text[i].length) {
            current = text[i].substring(0, j++);
        } else if (del && j >= 0) {
            current = text[i].substring(0, j--);
        }

        el.innerHTML = current;

        if (j === text[i].length) del = true;
        if (j === 0) { del = false; i++; }

        setTimeout(type, del ? 80 : 120);
    } else {
        i = 0;
        type();
    }
}
type();

// EMAILJS
document.addEventListener("DOMContentLoaded", function () {

    emailjs.init("62KuctRvN9v5M3DxM");

    const form = document.getElementById("contact-form");

    form.addEventListener("submit", function (e) {
        e.preventDefault();

        emailjs.sendForm(
            "service_iql7qas",
            "template_rt16qr6",
            this
        )
        .then(() => {
            form.innerHTML = "<h2 style='color:#a855f7;'>Thanks! I'll contact you soon 🚀</h2>";
        })
        .catch((error) => {
            alert("Failed 😢 " + JSON.stringify(error));
        });

    });

});
</script>

</body>
</html>
